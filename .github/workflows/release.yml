name: Release Readiness

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build and validate the question bank
        run: |
          python tools/build_static_pwa_assets.py
          python tools/validate_question_bank.py
      - name: Test the browser learning modules
        run: node --test tests/frontend/*.test.mjs
      - name: Test the content pipeline and PWA
        run: python -m pytest --cov=gtest_quiz --cov-report=term-missing --cov-fail-under=70
      - name: Check release readiness
        run: python tools/release_readiness.py
