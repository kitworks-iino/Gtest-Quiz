name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate question bank
        run: |
          python tools/validate_question_bank.py

      - name: Build static PWA assets
        run: |
          python tools/build_static_pwa_assets.py

      - name: Check OpenAPI contract
        run: |
          pytest tests/contracts

      - name: Test browser learning and content guard modules
        run: node --test tests/frontend/*.test.mjs

      - name: Run unit + integration + backend + frontend tests
        run: |
          pytest tests/test_question_quality.py tests/test_content_factory.py tests/test_refill_pipeline.py tests/integration tests/backend tests/frontend -m "not e2e" --cov=gtest_quiz --cov=backend/app --cov-report=term-missing --cov-fail-under=70

      - name: Run learning policy benchmark
        run: |
          python tools/benchmark_learning_policy.py --compare

      - name: Check release readiness rubric
        env:
          READINESS_PROFILE: bootstrap
        run: |
          python tools/release_readiness.py

      - name: Run e2e smoke
        run: |
          pytest tests/e2e -m e2e
