name: Auto Refill Question Bank (Quality Pipeline)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Generation mode"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - seed
          - reset_and_seed
          - replace
          - build_to_complete
          - build_to_expanded
          - validate_only
      target:
        description: "Target accepted questions for this run"
        required: false
        default: ""
      readiness_profile:
        description: "Readiness profile to check after generation"
        required: false
        default: "bootstrap"
        type: choice
        options:
          - bootstrap
          - alpha
          - beta
          - complete
          - expanded

permissions:
  contents: write

concurrency:
  group: question-bank-quality-refill
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  auto-refill-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run schema-first quality refill
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
          ENFORCE_GEMINI35: ${{ vars.ENFORCE_GEMINI35 || 'true' }}
          QUESTION_BANK_EPOCH: ${{ vars.QUESTION_BANK_EPOCH || 'gemini35_v1' }}
          GENERATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'daily' }}
          GENERATION_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || '' }}
          DAILY_TARGET: ${{ vars.DAILY_TARGET || '10' }}
          SEED_TARGET_DEFAULT: ${{ vars.SEED_TARGET_DEFAULT || '15' }}
          SEED_TARGET_MAX: ${{ vars.SEED_TARGET_MAX || '30' }}
          COMPLETE_TARGET_QUESTIONS: ${{ vars.COMPLETE_TARGET_QUESTIONS || '550' }}
          EXPANDED_TARGET_QUESTIONS: ${{ vars.EXPANDED_TARGET_QUESTIONS || '1000' }}
          MIN_PER_CHAPTER_COMPLETE: ${{ vars.MIN_PER_CHAPTER_COMPLETE || '10' }}
          INITIAL_TARGET_PER_RUN: ${{ vars.INITIAL_TARGET_PER_RUN || '15' }}
          MAX_RETRY: ${{ vars.MAX_RETRY || '3' }}
          MIN_EXPLANATION_LENGTH: ${{ vars.MIN_EXPLANATION_LENGTH || '120' }}
          MAX_RUNTIME_MINUTES: ${{ vars.MAX_RUNTIME_MINUTES || '25' }}
          RESET_QUESTION_BANK: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'reset_and_seed' && 'true' || 'false' }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "GEMINI_MODEL=$GEMINI_MODEL"
          echo "ENFORCE_GEMINI35=$ENFORCE_GEMINI35"
          if [ "$GEMINI_MODEL" != "gemini-3.5-flash" ]; then
            echo "::warning::GEMINI_MODEL is $GEMINI_MODEL; expected gemini-3.5-flash"
            if [ "$ENFORCE_GEMINI35" = "true" ]; then
              echo "::error::ENFORCE_GEMINI35=true rejects non-gemini-3.5-flash models"
              exit 1
            fi
          fi
          python tools/auto_refill_quality.py --mode "$GENERATION_MODE" --target "$GENERATION_TARGET" | tee refill-result.json
          if [ "$GENERATION_MODE" != "validate_only" ]; then
            python tools/assert_refill_result.py refill-result.json
          fi

      - name: Validate generated content
        env:
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
          QUESTION_BANK_EPOCH: ${{ vars.QUESTION_BANK_EPOCH || 'gemini35_v1' }}
        run: |
          python tools/review_generated_queue.py --summary
          python tools/generate_coverage_report.py
          python tools/build_static_pwa_assets.py
          python tools/validate_question_bank.py
          READINESS_PROFILE="${{ github.event_name == 'workflow_dispatch' && inputs.readiness_profile || 'bootstrap' }}" python tools/release_readiness.py

      - name: Commit and push reviewed artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add bank/question_bank.jsonl bank/meta.json \
            bank/generated_review_queue.jsonl bank/question_provenance.jsonl \
            bank/coverage_report.json frontend/src/question-bank.json \
            frontend/src/service-worker.js

          echo "updated_files=$(git diff --cached --name-only | tr '\n' ' ')"

          if git diff --cached --quiet; then
            echo "No generated content changes to commit."
            echo "commit_created=false"
          else
            git commit -m "chore: quality refill question bank"
            git push
            echo "commit_created=true"
          fi
