name: Static PWA Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Auto Refill Question Bank (Quality Pipeline)"]
    types: [completed]
    branches: ["main"]
  push:
    branches: ["main"]
    paths:
      - "frontend/src/**"
      - "bank/question_bank.jsonl"
      - "tools/build_static_pwa_assets.py"
      - "tools/validate_question_bank.py"
      - "gtest_quiz/bank_epoch.py"
      - "gtest_quiz/question_quality.py"
      - "tests/frontend/*.test.mjs"
      - ".github/workflows/static-pwa-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # A refill commits its generated bank after its original trigger SHA.
          # GITHUB_TOKEN pushes cannot trigger this workflow's push event.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Build and validate static PWA assets
        run: |
          python tools/build_static_pwa_assets.py
          python tools/validate_question_bank.py
          node --test tests/frontend/*.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static PWA
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/src
          retention-days: 1
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
